<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOMPAK – Prototype Interaktif Kompas Kerja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --page-a:#E9FBFE; --page-b:#FFF1E4; --page-ink:#282F5A; --page-soft:#5B6485;
  --page-card:#FFFFFF; --page-line:#DCE6F2; --page-chip:#EEF6FD;
  /* app tokens (the app itself keeps the team's light design) */
  --navy:#282F5A; --ink:#2A3550; --muted:#6C7690; --blue:#1B4F93; --blue2:#3E86CF; --sky:#86CDFA;
  --cyan:#8DF6FD; --warm:#F7CC9D; --orange:#F28C28; --yellow:#FCC727; --green:#2F9E57; --red:#E03B4B;
  --line:#E7ECF3; --soft:#F5F8FC;
  --grad:linear-gradient(90deg,#1B4F93 0%,#4F95D8 60%,#86CDFA 100%);
  --sh:0 3px 10px rgba(40,47,90,.16);
  --sb:38px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--page-a:#0F1A33;--page-b:#1D1A2B;--page-ink:#EEF3FF;--page-soft:#AFB8D4;--page-card:#18233F;--page-line:#2B3960;--page-chip:#22305A}
}
:root[data-theme="dark"]{color-scheme:dark;--page-a:#0F1A33;--page-b:#1D1A2B;--page-ink:#EEF3FF;--page-soft:#AFB8D4;--page-card:#18233F;--page-line:#2B3960;--page-chip:#22305A}
*{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;height:100%;font-family:Poppins,"Segoe UI",system-ui,-apple-system,Arial,sans-serif;background:linear-gradient(160deg,var(--page-a),var(--page-b));color:var(--page-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}
:focus-visible{outline:3px solid #F7A440;outline-offset:2px}
img{max-width:100%}

/* ---------- stage (desktop) ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:56px;padding:24px}
.guide{width:340px;max-height:calc(100vh - 48px);overflow:auto;padding-right:4px}
.guide .g-logo{width:118px;display:block;margin-bottom:14px}
.guide h1{font-size:23px;line-height:1.25;margin:0 0 8px;font-weight:700}
.guide p{font-size:13.5px;line-height:1.55;color:var(--page-soft);margin:0 0 16px}
.guide h2{font-size:12.5px;font-weight:600;color:var(--page-soft);margin:18px 0 8px}
.g-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--page-card);border:1px solid var(--page-line);color:var(--page-ink);border-radius:14px;padding:9px 12px;margin-bottom:7px;font-size:13.5px;font-weight:600}
.g-btn img{width:30px;height:30px;flex:none}
.g-btn small{display:block;font-weight:400;font-size:11.5px;color:var(--page-soft)}
.g-btn:hover{border-color:#86CDFA}
.g-btn.on{border-color:#3E86CF;box-shadow:0 0 0 2px rgba(62,134,207,.25)}
.g-num{width:30px;height:30px;border-radius:50%;background:var(--page-chip);display:grid;place-items:center;font-size:13px;flex:none}
.g-note{font-size:11.5px;color:var(--page-soft);line-height:1.5;margin-top:14px}
.g-reset{background:transparent;border:1px dashed var(--page-line);color:var(--page-soft);border-radius:12px;padding:8px 12px;font-size:12.5px;margin-top:6px}
.device-wrap{flex:none;width:414px;height:868px;position:relative}
.device{width:414px;height:868px;border-radius:58px;background:#11162A;padding:12px;box-shadow:0 30px 70px rgba(20,30,70,.35),inset 0 0 0 2px #2A3150;transform-origin:top left;position:absolute;left:0;top:0}
.island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:118px;height:32px;background:#000;border-radius:20px;z-index:60}
.screen{width:390px;height:844px;border-radius:46px;overflow:hidden;position:relative;background:#fff;color:var(--navy);isolation:isolate}
.statusbar{position:absolute;top:0;left:0;right:0;height:var(--sb);z-index:55;display:flex;justify-content:space-between;align-items:center;padding:6px 30px 0 34px;font-size:14px;font-weight:600;color:#111;pointer-events:none}
.statusbar .sbi{display:flex;gap:5px;align-items:center}

@media (max-width:820px){
  .stage{padding:0;display:block;height:100%}
  .guide{display:none}
  .device-wrap{width:100%;height:100%}
  .device{position:static;width:100%;height:100%;border-radius:0;padding:0;box-shadow:none;background:#fff;transform:none!important}
  .island,.statusbar{display:none}
  .screen{width:100%;height:100%;border-radius:0}
  :root{--sb:0px}
}

/* ---------- app shell ---------- */
.view{position:absolute;inset:0;display:flex;flex-direction:column;background:#fff;animation:vin .22s ease-out}
.view.back-anim{animation:vback .22s ease-out}
@keyframes vin{from{transform:translateX(18px);opacity:.4}to{transform:none;opacity:1}}
@keyframes vback{from{transform:translateX(-18px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.view,.view.back-anim{animation:none}*{transition:none!important;animation-duration:.01ms!important}}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.pad{padding:0 20px}
.sbspace{height:var(--sb);flex:none}
.topbar{flex:none;background:#fff;padding:calc(var(--sb) + 8px) 18px 14px;display:flex;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(40,47,90,.08);border-radius:0 0 22px 22px;position:relative;z-index:5}
.topbar h1{font-size:21px;margin:0;font-weight:700;color:var(--navy);flex:1;line-height:1.2}
.topbar .sub{display:block;font-size:11.5px;font-weight:500;color:var(--muted);margin-top:2px}
.ibtn{width:40px;height:40px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--navy);flex:none;position:relative}
.ibtn:active{background:var(--soft)}
.ibtn svg{width:24px;height:24px}
.badge{position:absolute;top:3px;right:3px;min-width:17px;height:17px;border-radius:9px;background:#E8323F;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}

.bnav{flex:none;display:flex;justify-content:space-around;background:#fff;box-shadow:0 -3px 14px rgba(40,47,90,.10);padding:8px 6px calc(10px + env(safe-area-inset-bottom,0px));position:relative;z-index:6}
.bnav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;color:#5E6A80;width:78px;position:relative;padding:2px 0}
.bnav svg{width:26px;height:26px;color:#2A384C}
.bnav button.on{color:var(--blue)}
.bnav button.on svg{color:var(--blue)}
.bnav .badge{right:18px;top:-2px}

/* ---------- typography & common ---------- */
.h2{font-size:17px;font-weight:700;color:var(--navy);margin:0}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{border:0;background:none;color:var(--navy);font-size:14px;display:flex;align-items:center;gap:2px;padding:4px 0}
.link svg{width:16px;height:16px}
.muted{color:var(--muted)}
.small{font-size:12px}
.card{background:#fff;border-radius:18px;box-shadow:var(--sh)}
.btn{border:0;border-radius:28px;background:var(--grad);color:#fff;font-weight:600;font-size:16px;padding:14px 20px;width:100%;box-shadow:0 6px 14px rgba(27,79,147,.28)}
.btn:active{transform:scale(.985)}
.btn.ghost{background:#fff;color:var(--blue);box-shadow:inset 0 0 0 1.5px #BBD8F2}
.btn.sm{font-size:13.5px;padding:9px 14px;width:auto}
.btn.ok{background:linear-gradient(90deg,#1E7A45,#49B36F)}
.btn[disabled]{opacity:.55}
.tag{display:inline-block;white-space:nowrap;border-radius:8px;padding:2px 12px;font-size:12.5px;color:var(--navy);line-height:1.5}
.t-mode{background:#DDEFFC}.t-kerja{background:#FFDD9C}.t-magang{background:#DFF1E3}.t-pelatihan{background:#FCE1E5}.t-flex{background:#EDE6FF}.t-ok{background:#DFF5E6;color:#1E7A45}.t-warn{background:#FFF0D6;color:#9A5A00}.t-risk{background:#FDE1E3;color:#B4232F}
.chip{border:1.5px solid #CFE2F5;background:#fff;color:var(--navy);border-radius:20px;padding:6px 14px;font-size:13px;white-space:nowrap}
.chip.on{background:var(--grad);border-color:transparent;color:#fff}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips.scrollx{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chips.scrollx::-webkit-scrollbar{display:none}
.seg{display:flex;background:#fff;border-radius:26px;box-shadow:var(--sh);padding:4px}
.seg button{white-space:nowrap;flex:1;border:0;background:none;border-radius:22px;padding:10px 6px;font-size:14.5px;color:var(--navy)}
.seg button.on{background:var(--grad);color:#fff;font-weight:600}
.search{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;box-shadow:var(--sh);padding:11px 14px;color:#9AA2B5;font-size:14.5px}
.search svg{width:22px;height:22px;color:#9AA2B5;flex:none}
.search{min-width:0}
.search input{border:0;outline:0;flex:1;font-size:14.5px;color:var(--navy);background:none;min-width:0}
.sec{padding:18px 20px 4px}
.note{font-size:12px;color:var(--muted);line-height:1.5}
.stat{font-size:28px;font-weight:700;color:var(--navy);line-height:1.1}
.ring{--p:70;--c:#3E86CF;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),#E6EEF7 0);display:grid;place-items:center;flex:none}
.ring b{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;color:var(--navy)}
.ring.lg{width:112px;height:112px}.ring.lg b{width:88px;height:88px;font-size:28px}
.bar{height:8px;border-radius:6px;background:#E6EEF7;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:var(--grad)}
.empty{text-align:center;color:var(--muted);font-size:13.5px;padding:30px 20px}
.why{background:linear-gradient(90deg,#E6F4FA,#FFE6D7);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center}
.why img{width:40px;height:40px;flex:none}
.why p{margin:0;font-size:12.5px;line-height:1.45;color:var(--navy)}
.why b{font-weight:700}
.list-gap>*+*{margin-top:12px}
hr.sep{border:0;border-top:1px solid var(--line);margin:14px 0}

/* ---------- splash / onboarding ---------- */
.splash{position:absolute;inset:0;background:#fff;overflow:hidden}
.splash .slides{display:flex;height:100%;transition:transform .35s ease;touch-action:pan-y;user-select:none}
.splash img{-webkit-user-drag:none;user-select:none}
.splash .slide{flex:none;width:100%;height:100%;position:relative;overflow:hidden}
.s1img{position:absolute;left:0;top:0;width:100%;height:auto}
.hot{position:absolute;border:0;background:transparent;border-radius:14px}
.hot:focus-visible{outline:3px solid #F7A440}
.sx{background:linear-gradient(180deg,#8DF5FC 0%,#E9FDFF 30%,#FFF6EC 52%,#F7C894 100%)}
.sx .logo{width:150px;display:block;margin:calc(var(--sb) + 18px) auto 0}
.sx .art{position:relative;height:250px;margin:10px auto 0;width:300px}
.sx .art img{position:absolute;width:96px;filter:drop-shadow(0 6px 10px rgba(27,79,147,.25))}
.sx h2{font-size:22px;color:var(--navy);text-align:center;margin:8px 28px 6px;line-height:1.3}
.sx p{font-size:14px;color:#41506E;text-align:center;margin:0 34px;line-height:1.5}
.ellipse{position:absolute;left:-12%;right:-12%;bottom:-170px;height:390px;border-radius:50%;background:#fff;box-shadow:0 -8px 24px rgba(40,47,90,.10)}
.s-bottom{position:absolute;left:0;right:0;bottom:calc(28px + env(safe-area-inset-bottom,0px));padding:0 46px;text-align:center}
.s-bottom .masuk{margin-top:10px;font-size:15px;color:var(--blue);border:0;background:none}
.dots{display:flex;gap:7px;justify-content:center;margin-top:12px}
.dots i{width:7px;height:7px;border-radius:4px;background:#C9CED8;display:block;transition:width .2s}
.dots i.on{width:22px;background:var(--blue)}
.s-skip{position:absolute;top:calc(var(--sb) + 10px);right:16px;z-index:3;border:0;background:rgba(255,255,255,.75);border-radius:16px;padding:5px 12px;font-size:12.5px;color:var(--navy)}

/* ---------- forms ---------- */
.form-hd{background:linear-gradient(180deg,#8DF5FC,#EFFCFF);padding:calc(var(--sb) + 8px) 18px 18px;border-radius:0 0 26px 26px}
.steps{display:flex;gap:6px;margin-top:12px}
.steps i{flex:1;height:6px;border-radius:4px;background:rgba(255,255,255,.85)}
.steps i.on{background:var(--blue)}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--navy);margin-bottom:6px}
.inp{width:100%;border:1.5px solid #D7E3F0;border-radius:14px;padding:12px 14px;font-size:15px;color:var(--navy);background:#fff;outline:0}
.inp:focus{border-color:#3E86CF}
.upload{border:2px dashed #B8D3EE;border-radius:16px;padding:16px;text-align:center;color:var(--muted);font-size:13.5px;background:#F7FBFF;width:100%}
.upload.done{border-style:solid;border-color:#9FD8B4;background:#F1FBF4;color:#1E7A45}
.check{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;color:#41506E;line-height:1.45}
.check input{width:18px;height:18px;margin-top:2px;accent-color:#1B4F93;flex:none}
.foot{flex:none;padding:12px 20px calc(16px + env(safe-area-inset-bottom,0px));background:#fff;box-shadow:0 -4px 14px rgba(40,47,90,.07);display:flex;gap:10px}

/* AI analysing */
.ai{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;padding:30px;text-align:center;background:linear-gradient(180deg,#EFFCFF,#FFF1E2)}
.ai .spin{width:120px;height:120px;animation:rot 2.4s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.ai ul{list-style:none;padding:0;margin:22px 0 0;text-align:left;font-size:14px}
.ai li{display:flex;gap:8px;align-items:center;margin:8px 0;color:#9AA2B5}
.ai li.done{color:var(--navy)}
.ai li svg{width:20px;height:20px}

/* ---------- home ---------- */
.hh{position:relative;flex:none}
.hh img.bg{display:block;width:100%}
.hh .greet{position:absolute;left:3.6%;top:19.5%;font-size:15px;line-height:1.3;color:#1D2547}
.hh .greet b{font-size:16px}
.hh .banner{position:absolute;left:5.1%;top:52.6%;width:90%;height:22.8%;border-radius:20px;overflow:hidden;box-shadow:0 6px 14px rgba(27,79,147,.25);border:0;padding:0;background:var(--grad);text-align:left}
.bn-track{display:flex;height:100%;transition:transform .45s ease}
.bn{flex:none;width:100%;height:100%;display:flex;align-items:center;gap:14px;padding:0 40px 0 14px;color:#fff;position:relative}
.bn img{width:62px;height:62px;flex:none}
.bn p{margin:0;font-size:13.5px;line-height:1.35}
.bn b{font-weight:700}
.bn .go{position:absolute;right:12px;top:50%;margin-top:-12px;width:24px;height:24px;border-radius:50%;background:rgba(255,255,255,.85);color:var(--navy);display:grid;place-items:center}
.bn .go svg{width:14px;height:14px}
.bn-dots{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.bn-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.55)}
.bn-dots i.on{background:#fff}
.sheet-top{background:#fff;border-radius:26px 26px 0 0;margin-top:-26px;position:relative;z-index:2;padding-top:20px}
.fgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:14px 18px 4px}
.fbox{background:#fff;border-radius:12px;box-shadow:var(--sh);border:0;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--navy);min-height:120px}
.fbox img{width:52px;height:52px}
.fbox span{font-size:12.5px;line-height:1.12;text-align:center;min-height:42px;display:flex;align-items:center}
.fbox svg{width:13px;height:13px}
.fphoto{grid-column:span 2;border-radius:16px;overflow:hidden;position:relative;border:0;padding:0;box-shadow:var(--sh)}
.fphoto img{width:100%;height:100%;object-fit:cover;display:block}
.fphoto span{position:absolute;left:10px;bottom:8px;right:10px;color:#fff;font-size:12.5px;font-weight:600;text-align:left;text-shadow:0 1px 4px rgba(0,0,0,.5)}
.info{display:flex;gap:12px;align-items:center;background:linear-gradient(90deg,#E6F4FA,#FFE6D7);border-radius:18px;box-shadow:var(--sh);padding:14px 14px;border:0;width:100%;text-align:left;color:var(--navy)}
.info img{width:52px;flex:none}
.info b{display:block;font-size:14.5px}
.info p{margin:2px 0 0;font-size:13px;line-height:1.35}
.info svg{width:18px;height:18px;flex:none}

/* ---------- list items ---------- */
.item{display:flex;gap:12px;background:#fff;border-radius:16px;box-shadow:var(--sh);padding:12px 12px;border:0;width:100%;text-align:left;color:var(--navy);align-items:center}
.item .lg{width:62px;flex:none;text-align:center;font-size:10.5px;line-height:1.2;color:var(--navy)}
.item .lg .lgi{width:56px;height:46px;margin:0 auto 3px;display:grid;place-items:center;border-radius:10px;overflow:hidden}
.item .lg img{max-width:56px;max-height:46px}
.item .bd{flex:1;min-width:0}
.item .org{font-size:13.5px;line-height:1.25}
.item .ttl{font-size:15px;font-weight:700;line-height:1.25;margin:1px 0 4px}
.item .meta{font-size:11.5px;color:#41506E;margin-top:5px;display:flex;gap:10px;flex-wrap:wrap}
.item .tags{display:flex;gap:6px;flex-wrap:wrap}
.item>svg{width:18px;height:18px;flex:none;color:var(--navy)}
.mono{width:56px;height:46px;border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.match{font-size:11px;font-weight:700;color:#1E7A45;background:#E3F6EA;border-radius:8px;padding:1px 7px}

/* ---------- map ---------- */
.mapbox{position:relative;height:230px;flex:none;overflow:hidden;background:#EEF0F2}
.mapbox svg.map{position:absolute;inset:0;width:100%;height:100%}
.pin{position:absolute;width:26px;height:34px;margin:-34px 0 0 -13px;border:0;background:none;padding:0;transition:transform .15s}
.pin svg{width:100%;height:100%;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.pin.sel{transform:scale(1.25);z-index:3}
.callout{position:absolute;background:#fff;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.22);padding:7px 10px;display:flex;gap:8px;align-items:center;z-index:4;border:0;text-align:left;color:var(--navy);max-width:220px;transform:translate(-50%,calc(-100% - 40px))}
.callout img,.callout .mono{width:34px;height:30px;flex:none;font-size:11px}
.callout b{display:block;font-size:13px;line-height:1.2}
.callout span{font-size:11.5px}
.legend{position:absolute;top:10px;right:10px;background:#fff;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.18);padding:6px 10px;font-size:12px;z-index:4}
.legend label{display:flex;align-items:center;gap:6px;margin:2px 0;cursor:pointer}
.legend input{accent-color:#1B4F93;width:15px;height:15px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.locate{position:absolute;right:12px;bottom:34px;width:40px;height:40px;border-radius:50%;background:#fff;border:0;box-shadow:0 3px 10px rgba(0,0,0,.2);display:grid;place-items:center;z-index:4;color:var(--navy)}
.locate svg{width:22px;height:22px}
.me{position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:#2F7BEA;border:3px solid #fff;box-shadow:0 0 0 0 rgba(47,123,234,.5);animation:pulse 1.8s infinite;z-index:3}
@keyframes pulse{70%{box-shadow:0 0 0 16px rgba(47,123,234,0)}100%{box-shadow:0 0 0 0 rgba(47,123,234,0)}}
.tipochip{position:absolute;left:10px;top:10px;white-space:nowrap;z-index:4;background:#fff;border:0;border-radius:12px;box-shadow:0 3px 10px rgba(0,0,0,.18);padding:6px 10px;font-size:11.5px;color:var(--navy);text-align:left;line-height:1.3}
.tipochip b{display:block;font-size:12px}
.results{background:#fff;border-radius:24px 24px 0 0;margin-top:-22px;position:relative;z-index:2;padding:16px 18px 18px}
.sortsel{border:0;background:#fff;box-shadow:var(--sh);border-radius:12px;padding:7px 10px;font-size:13.5px;color:var(--navy)}

/* ---------- detail ---------- */
.dhead{display:flex;gap:14px;align-items:center}
.dhead .lgi{width:74px;height:64px;border-radius:14px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;flex:none;overflow:hidden}
.dhead .lgi img{max-width:64px;max-height:54px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.fact{background:var(--soft);border-radius:14px;padding:10px 12px}
.fact span{display:block;font-size:11.5px;color:var(--muted)}
.fact b{font-size:14px;color:var(--navy)}
.ul{margin:6px 0 0;padding-left:18px;font-size:13.5px;line-height:1.6;color:#33405E}
.sk{display:inline-flex;align-items:center;gap:5px;border-radius:10px;padding:4px 10px;font-size:12.5px;margin:0 6px 6px 0}
.sk.have{background:#E3F6EA;color:#1E7A45}.sk.near{background:#FFF3D9;color:#9A5A00}.sk.gap{background:#FDECEE;color:#B4232F}
.sk svg{width:14px;height:14px}

/* ---------- skill gap ---------- */
.gaprow{margin:12px 0}
.gaprow .between{font-size:13px;margin-bottom:5px}
.dual{position:relative;height:12px;border-radius:8px;background:#EEF2F7}
.dual .you{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:var(--grad)}
.dual .need{position:absolute;top:-4px;width:3px;height:20px;background:#E8641E;border-radius:2px}
.course{display:flex;gap:12px;align-items:center}
.course .ci{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;flex:none;background:#FCE1E5;color:#B4232F}
.course .ci svg{width:24px;height:24px}

/* ---------- magang match ---------- */
.deck{position:relative;height:420px;margin:6px 20px 48px}
.mcard{position:absolute;inset:0;background:#fff;border-radius:24px;box-shadow:0 10px 26px rgba(40,47,90,.20);padding:18px;display:flex;flex-direction:column;touch-action:pan-y;user-select:none;transition:transform .3s ease,opacity .3s}
.mcard.under{transform:scale(.95) translateY(30px);filter:brightness(.985)}
.mcard.under2{transform:scale(.9) translateY(58px);filter:brightness(.97)}
.mcard.under2>*{visibility:hidden}
.mcard .stamp{position:absolute;top:22px;padding:4px 12px;border:3px solid;border-radius:10px;font-weight:700;font-size:18px;opacity:0;transform:rotate(-12deg)}
.mcard .stamp.yes{left:20px;color:#1E7A45;border-color:#1E7A45}
.mcard .stamp.no{right:20px;color:#B4232F;border-color:#B4232F;transform:rotate(12deg)}
.reason{display:flex;gap:8px;align-items:center;font-size:13px;color:#33405E;margin:6px 0}
.reason svg{width:18px;height:18px;color:#2F9E57;flex:none}
.reason.warn svg{color:#E8641E}
.mact{display:flex;justify-content:center;gap:22px;margin:18px 0 8px}
.mact button{width:62px;height:62px;border-radius:50%;border:0;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.mact button svg{width:28px;height:28px}
.mact .x{color:#B4232F}.mact .s{color:#E8A10E;width:52px;height:52px;align-self:center}.mact .y{background:var(--grad);color:#fff}
.timeline{margin:6px 0 0;padding:0;list-style:none}
.timeline li{display:flex;gap:12px;position:relative;padding-bottom:16px;font-size:13.5px}
.timeline li:before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:#DCE6F2}
.timeline li:last-child:before{display:none}
.timeline .dot{width:24px;height:24px;border-radius:50%;background:#DCE6F2;flex:none;display:grid;place-items:center;color:#fff;position:relative;z-index:1}
.timeline .dot svg{width:14px;height:14px}
.timeline li.done .dot{background:#2F9E57}
.timeline li.now .dot{background:var(--blue);box-shadow:0 0 0 4px rgba(27,79,147,.18)}
.timeline small{display:block;color:var(--muted);font-size:12px}

/* ---------- charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart text{font-family:Poppins,Arial,sans-serif}
.slider{width:100%;accent-color:#1B4F93}
.isl{display:grid;grid-template-columns:104px 1fr 46px;gap:8px;align-items:center;font-size:12.5px;margin:7px 0}
.isl .b{height:14px;border-radius:7px;background:#F7B877}
.ikr{font-size:11.5px;font-weight:700;border-radius:8px;padding:2px 0;text-align:center;background:#FFF0E2;color:#B85410}
.ikr.hi{background:#E03B4B;color:#fff}
.prov{border:1.5px solid #E3E9F2;background:#fff;border-radius:12px;padding:5px 10px;font-size:12.5px;color:var(--navy);display:inline-flex;align-items:center;gap:6px;margin:0 6px 6px 0}
.prov i{width:9px;height:9px;border-radius:50%}
.prov.on{border-color:#1B4F93;box-shadow:0 0 0 2px rgba(27,79,147,.18)}

/* ---------- kerja fleksibel ---------- */
.avail{display:grid;grid-template-columns:44px repeat(7,1fr);gap:4px;font-size:11px;text-align:center;color:var(--muted)}
.avail button{height:28px;border-radius:7px;border:0;background:#EEF2F7}
.avail button.on{background:#7C5CD6}

/* ---------- NEET ---------- */
.months{display:flex;gap:4px;margin:10px 0 4px}
.months i{flex:1;height:10px;border-radius:5px;background:#E6EEF7}
.months i.past{background:#86CDFA}.months i.now{background:var(--blue)}
.opt{display:flex;gap:10px;align-items:center;width:100%;border:1.5px solid #DCE6F2;background:#fff;border-radius:14px;padding:11px 12px;font-size:14px;color:var(--navy);margin-bottom:8px;text-align:left}
.opt.on{border-color:#1B4F93;background:#F1F7FE}
.opt .em{font-size:20px;width:26px;text-align:center}
.alumni{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.alumni:last-child{border-bottom:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.legendrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:#33405E}
.legendrow i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* ---------- profile ---------- */
.phead{background:linear-gradient(180deg,#8DF5FC 0%,#E9FDFF 55%,#FFF1E2 100%);padding:calc(var(--sb) + 10px) 20px 46px;text-align:center;position:relative}
.phead .av{width:76px;height:76px;font-size:26px;margin:0 auto 8px;background:var(--grad);border:4px solid #fff;box-shadow:var(--sh)}
.toggle{position:relative;width:46px;height:26px;flex:none}
.toggle input{opacity:0;width:0;height:0;position:absolute}
.toggle span{position:absolute;inset:0;border-radius:14px;background:#CFD7E3;transition:.2s}
.toggle span:before{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.toggle input:checked+span{background:#1B4F93}
.toggle input:checked+span:before{transform:translateX(20px)}
.toggle input:focus-visible+span{outline:3px solid #F7A440}
.setrow{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
.setrow:last-child{border-bottom:0}
.setrow .tx{flex:1}
.setrow small{display:block;color:var(--muted);font-size:11.5px;line-height:1.35}
.lite .hide-lite{display:none!important}

/* ---------- overlays ---------- */
.overlay{position:absolute;inset:0;background:rgba(20,26,50,.45);z-index:40;display:flex;align-items:flex-end;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{background:#fff;border-radius:26px 26px 0 0;width:100%;max-height:86%;overflow:auto;padding:10px 20px calc(22px + env(safe-area-inset-bottom,0px));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.grab{width:44px;height:5px;border-radius:3px;background:#D4DBE6;margin:0 auto 12px}
.toast{position:absolute;left:16px;right:16px;top:calc(var(--sb) + 8px);z-index:50;opacity:0;visibility:hidden;background:#1F2A4D;color:#fff;border-radius:16px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:center;box-shadow:0 10px 24px rgba(0,0,0,.25);transform:translateY(-30px);transition:transform .3s ease,opacity .3s,visibility .3s}
.toast.show{transform:none;opacity:1;visibility:visible}
.toast svg{width:22px;height:22px;flex:none;color:#86CDFA}

.view.noanim{animation:none}
.dots i{cursor:pointer}

.upload svg{width:22px;height:22px;vertical-align:-6px}
.setrow>span svg{width:22px;height:22px;display:block}
.results b{font-size:15.5px}
</style>
</head>

function gapsOf(role){ return Object.entries(ROLES[role]).map(([k,v]) => ({k, need:v, you:S.skills[k]||0})).sort((a,b)=>(a.you-a.need)-(b.you-b.need)); }

/* ================= RADAR PROYEKSI ================= */
function tptChart(){
  const W=340,H=200,L=30,R=8,T=12,B=26, n = TPT_ACT.length + TPT_PROJ.length, lo=3.4, hi=7.3;
  const x = i => L + i*(W-L-R)/(n-1), y = v => T + (hi-v)*(H-T-B)/(hi-lo);
  const a0 = TPT_ACT.length-1;
  const band = TPT_HI.map((v,i)=>`${x(a0+1+i)},${y(v)}`).join(' ') + ' ' + TPT_LO.map((v,i)=>`${x(a0+1+i)},${y(v)}`).reverse().join(' ');
  const act = TPT_ACT.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  const pr = [TPT_ACT[a0], ...TPT_PROJ].map((v,i)=>`${x(a0+i)},${y(v)}`).join(' ');
  const yr = []; for (let k=0;k<n;k+=4) yr.push(`<text x="${x(k)}" y="${H-8}" font-size="9" text-anchor="middle" fill="#6C7690">${2014+k/2}</text>`);
  const grid = [4,5,6,7].map(v=>`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="#EEF2F7"/><text x="${L-6}" y="${y(v)+3}" font-size="9" text-anchor="end" fill="#6C7690">${v}%</text>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik TPT nasional 2014–2026 dan proyeksi hingga 2030">${grid}
    <rect x="${x(a0)}" y="${T}" width="${W-R-x(a0)}" height="${H-T-B}" fill="#FFF7E6"/>
    <polygon points="${x(a0)},${y(TPT_ACT[a0])} ${band}" fill="#FFD87D" opacity=".8"/>
    <line x1="${x(a0)}" x2="${x(a0)}" y1="${T}" y2="${H-B}" stroke="#9AA2B5" stroke-dasharray="3 3"/>
    <text x="${x(a0)+4}" y="${T+10}" font-size="9" fill="#C2571A" font-weight="600">Proyeksi</text><text x="${x(13)}" y="${y(7.07)-6}" font-size="8.5" fill="#B4232F" text-anchor="middle">COVID-19</text>
    <polyline points="${act}" fill="none" stroke="#1B4F93" stroke-width="2.4" stroke-linejoin="round"/>
    ${TPT_ACT.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="2.2" fill="#1B4F93"/>`).join('')}
    <polyline points="${pr}" fill="none" stroke="#E8641E" stroke-width="2.4" stroke-dasharray="5 3"/>
    ${TPT_PROJ.map((v,i)=>`<circle cx="${x(a0+1+i)}" cy="${y(v)}" r="2.4" fill="#E8641E"/>`).join('')}${yr.join('')}</svg>`;
}

/* ================= RENDER ================= */
const $app = document.getElementById('app');
const $toast = document.getElementById('toast');
let bannerTimer = null, epoch = 0, swiped = false, toastTimer = null;

let rendering = false;
function render(dir='fwd'){
  if (rendering) return; rendering = true;
  const old = $app.querySelector('.scroll'), keep = dir==='same' && old ? old.scrollTop : 0;
  const sheet = S.sheet ? `<div class="overlay" data-a="closeSheet"><div class="sheet" role="dialog" aria-modal="true" aria-label="Detail"><div class="grab"></div>${SHEETS[S.sheet]()}</div></div>` : '';
  try { $app.innerHTML = `<div class="view ${dir==='back'?'back-anim':dir==='same'?'noanim':''} ${S.lite?'lite':''}">${SCREENS[S.screen]()}</div>${sheet}`; }
  finally { rendering = false; }
  const sc = $app.querySelector('.scroll'); if (sc && keep) sc.scrollTop = keep;
  after();
}
function refresh(){ const f = document.activeElement; if (f && f.dataset && f.dataset.in) return; render('same'); }
function go(screen, params={}){ S.stack.push({screen:S.screen, params:S.params}); S.screen = screen; S.params = params; S.sheet = null; render('fwd'); }
function back(){ const p = S.stack.pop(); if (!p) return; S.screen = p.screen; S.params = p.params; S.sheet = null; render('back'); }
function tab(screen){ S.stack = []; S.screen = screen; S.params = {}; S.sheet = null; render('fwd'); }

function toast(msg, icon='check'){
  $toast.innerHTML = ic(icon) + `<span>${msg}</span>`; $toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>$toast.classList.remove('show'), 3200);
}
function addNotif(n){ S.notifs.unshift({...n, id:++S.nid, read:false}); toast(n.t, n.ic); refresh(); }

function applyItem(id){
  const it = byId(id), ep = epoch; if (S.applied[id]) return;
  S.applied[id] = {st:0, ok:false};
  toast(`${it.type==='magang'?'Pengajuan magang':'Lamaran'} ke ${esc(it.org)} terkirim`, 'send');
  setTimeout(()=>{ if (ep!==epoch || !S.applied[id]) return; S.applied[id].st = 1; addNotif({ic:'brief', t:`${esc(it.org)} sedang meninjau ${it.type==='magang'?'pengajuan magangmu':'lamaranmu'}`, s:'Peluang · baru saja', go:'peluang'}); }, 6000);
  setTimeout(()=>{ if (ep!==epoch || !S.applied[id]) return; S.applied[id].st = 2; addNotif({ic:'cal', t:`Kamu diundang wawancara oleh ${esc(it.org)}: Kamis, 10.00 WIB`, s:'Peluang · baru saja', go:'peluang'}); }, 15000);
}
function finishCourse(id){
  const c = byId(id);
  c.boost.forEach(k => S.skills[k] = Math.min(100, (S.skills[k]||0) + 25));
  addNotif({ic:'book', t:`Selamat! ${esc(c.title)} selesai. Skor kesiapanmu naik jadi ${readiness(S.target)}.`, s:'Pelatihan · sertifikat didapat', go:'profil'});
}
function setSlide(i){
  S.slide = Math.max(0, Math.min(3, i));
  const el = $app.querySelector('.slides'); if (el) el.style.transform = `translateX(-${S.slide*100}%)`;
}
function simOut(){
  const r = S.radar, t30 = 4.97 - r.add/1540, hit = t30 <= 4.505;
  const el = document.getElementById('simout'); if (!el) return;
  el.querySelector('[data-o=v]').textContent = r.add.toLocaleString('id-ID') + ' ribu orang';
  el.querySelector('[data-o=t]').textContent = fmt(t30,2) + '%'; el.querySelector('[data-o=t]').style.color = hit ? '#1E7A45' : '#282F5A';
  el.querySelector('[data-o=m]').textContent = hit ? 'Target TPT 4,50% tercapai.' : `Butuh ±${Math.max(0,721-r.add).toLocaleString('id-ID')} ribu lagi untuk mencapai target 4,50%.`;
  const b = el.querySelector('[data-o=b]'); b.style.width = Math.min(100, r.add/721*100) + '%'; b.style.background = hit ? 'linear-gradient(90deg,#1E7A45,#49B36F)' : '';
}
function finishRegistration(){
  const r = S.reg, ep = ++epoch;
  S.user.name = r.name.trim() || 'Afriza Maulana'; S.user.jurusan = r.jurusan; S.user.kota = r.kota;
  S.user.lulus = r.lulus==='Belum lulus' ? 'belum lulus' : 'Juni ' + r.lulus;
  S.user.status = {'Siswa SMK kelas XII':'Siswa SMK','Lulusan SMK/SMA':'Lulusan SMK','Mahasiswa / lulusan PT':'Mahasiswa','Tidak sekolah & belum bekerja':'Mencari kesempatan'}[r.status];
  S.skills = {...BASE_SKILLS};
  REG_SKILL.forEach(k => S.skills[k] = r.skills.has(k) ? Math.max(BASE_SKILLS[k], 70) : Math.min(BASE_SKILLS[k], 40));
  const j = r.jurusan;
  S.target = /Komputer|Perangkat/.test(j) ? 'IT Support Junior' : /Mesin|Listrik/.test(j) ? 'Operator Produksi' : /Pemasaran/.test(j) ? 'Digital Marketing' : /IPA/.test(j) ? 'Data Analyst Junior' : 'Administrasi';
  S.logged = true; S.stack = []; S.screen = 'analyzing'; S.params = {k:0}; render('fwd');
  [1,2,3].forEach(k => setTimeout(()=>{ if (ep!==epoch) return; S.params = {k}; render('same'); }, k*850));
  setTimeout(()=>{ if (ep!==epoch) return; S.screen = 'ready'; S.params = {}; render('fwd'); }, 3200);
}
function magDecide(kind){
  const list = magangList(); if (!list.length) return;
  const it = list[0], c = document.getElementById('topcard');
  const commit = () => {
    S.magang.log[it.id] = kind;
    if (kind==='save') { S.saved.add(it.id); toast(`${esc(it.title)} disimpan`, 'bookmark'); }
    if (kind==='apply') applyItem(it.id);
    render('same');
  };
  if (c) { c.style.transition = 'transform .28s ease, opacity .28s'; c.style.transform = kind==='skip' ? 'translateX(-130%) rotate(-14deg)' : kind==='apply' ? 'translateX(130%) rotate(14deg)' : 'translateY(-40px) scale(.9)'; c.style.opacity = '0'; setTimeout(commit, 260); }
  else commit();
}

/* ================= ACTIONS ================= */
const ACT = {
  go: v => v.startsWith('detail:') ? go('detail', {id:v.slice(7)}) : go(v),
  open: v => go('detail', {id:v}),
  back, tab,
  start: () => { S.reg.step = 1; go('register'); },
  login: () => go('login'),
  doLogin: () => { S.logged = true; S.stack = []; S.screen = 'home'; render('fwd'); },
  slide: v => setSlide(+v),
  goPeta: v => { S.logged = true; S.stack = [{screen:'home', params:{}}]; S.peta.tab = v; S.screen = 'peta'; S.params = {}; render('fwd'); },
  regPick: (v, t) => { const k = t.dataset.k; if (S.reg[k] instanceof Set) { S.reg[k].has(v) ? S.reg[k].delete(v) : S.reg[k].add(v); } else S.reg[k] = v; render('same'); },
  regUpload: () => { S.reg.ijazah = true; toast('Ijazah terbaca dan terverifikasi'); render('same'); },
  regConsent: (v, t) => { S.reg.consent = t.checked; render('same'); },
  regNext: () => { if (S.reg.step < 4) { S.reg.step++; render('fwd'); } else finishRegistration(); },
  regBack: () => { S.reg.step--; render('back'); },
  toHome: () => tab('home'),
  sheet: v => { S.sheet = v; render('same'); },
  closeSheet: (v, t, e) => { if (e.target.closest('.sheet')) return; S.sheet = null; render('same'); },
  petaTab: v => { S.peta.tab = v; render('same'); },
  pin: v => { S.peta.sel = v; render('same'); },
  legend: (v, t) => { S.peta.show[v] = t.checked; render('same'); },
  locate: () => { S.peta.me = true; S.peta.sort = 'terdekat'; toast('Lokasimu: Gubeng, Surabaya. Hasil diurutkan dari yang terdekat.', 'pin'); render('same'); },
  save: v => { S.saved.has(v) ? (S.saved.delete(v), toast('Dihapus dari Tersimpan','bookmark')) : (S.saved.add(v), toast('Disimpan ke Peluang › Tersimpan','bookmark')); render('same'); },
  apply: v => { applyItem(v); render('same'); },
  tabPeluang: () => { S.peluangTab = 'lamaran'; tab('peluang'); },
  enroll: v => { S.courses[v] = 0; toast(`Terdaftar di ${esc(byId(v).title)}. Modul pertama sudah terbuka.`, 'book'); render('same'); },
  learn: v => { S.courses[v] = Math.min(100, S.courses[v] + 25); if (S.courses[v] === 100) finishCourse(v); else toast(`Modul selesai · progres ${S.courses[v]}%`, 'book'); render('same'); },
  skillRole: v => { S.skill.role = v; S.skill.state = 'idle'; go('skill'); },
  skillPick: v => { S.skill.role = v; S.skill.state = 'idle'; render('same'); },
  analyse: () => { S.skill.state = 'loading'; render('same'); const ep = epoch; setTimeout(()=>{ if (ep!==epoch) return; S.skill.state = 'done'; if (S.screen==='skill') render('same'); }, 1400); },
  magJur: v => { S.magang.jur = v; render('same'); },
  magAct: v => magDecide(v),
  magReset: () => { S.magang.log = {}; render('same'); },
  radarTab: v => { S.radar.tab = v; render('same'); },
  prov: v => { S.radar.prov = v; render('same'); },
  radarTipologi: () => { S.sheet = null; S.radar.tab = 'tipologi'; S.radar.prov = 'Jawa Timur'; go('radar'); },
  flexTag: v => { S.fleks.tags.has(v) ? S.fleks.tags.delete(v) : S.fleks.tags.add(v); render('same'); },
  slot: v => { S.fleks.slots.has(v) ? S.fleks.slots.delete(v) : S.fleks.slots.add(v); render('same'); },
  neetSet: v => { S.neet.status = v; if (v==='none' || v==='cari') toast(S.consent.sekolah ? `Status dicatat. Guru BK ${esc(S.user.sekolah)} menerima tanda untuk mendampingimu.` : 'Status dicatat. Rencana 30 hari sudah disiapkan.', 'shield'); else toast('Status bulan ini tercatat. Terima kasih!'); render('same'); },
  neetView: v => { S.neet.view = v; render('same'); },
  neetSend: v => { S.neet.sent.add(v); toast(`Rekomendasi pelatihan & magang dikirim ke ${esc(v)}`, 'send'); render('same'); },
  consent: (v, t) => { if (v==='lite') { S.lite = t.checked; toast(t.checked ? 'Mode ringan aktif: gambar besar disembunyikan' : 'Mode ringan dimatikan', 'wifi'); } else S.consent[v] = t.checked; render('same'); },
  target: v => { S.target = v; render('same'); },
  readAll: () => { S.notifs.forEach(n => n.read = true); render('same'); },
  notifGo: v => { const n = S.notifs.find(x => x.id == v); n.read = true; if (n.go==='peluang') ACT.tabPeluang(); else ACT.go(n.go); },
  confirm: v => { S.applied[v].ok = true; toast('Kehadiran wawancara dikonfirmasi. Tautan video call dikirim lewat email.', 'cal'); render('same'); },
  logout: () => { epoch++; S = initState(); render('back'); syncGuide(); },
  toast: v => toast(v, 'send'),
  searchSet: v => { S.search = v; render('same'); },
};

$app.addEventListener('click', e => {
  if (swiped) { e.preventDefault(); return; }
  const t = e.target.closest('[data-a]'); if (!t || t.tagName === 'INPUT') return;
  const f = ACT[t.dataset.a]; if (f) f(t.dataset.v, t, e);
  syncGuide();
});
$app.addEventListener('change', e => {
  const t = e.target;
  if (t.type === 'checkbox' && t.dataset.a) { ACT[t.dataset.a](t.dataset.v, t, e); return; }
  if (t.dataset.in && (t.tagName === 'SELECT' || t.type === 'range')) setIn(t.dataset.in, t.value, t, true);
});
$app.addEventListener('input', e => { const t = e.target; if (t.dataset.in && t.tagName !== 'SELECT') setIn(t.dataset.in, t.value, t, false); });
function setIn(path, val, el, isChange){
  const [a, b] = path.split('.');
  if (path === 'radar.add') { S.radar.add = +val; simOut(); return; }
  if (b) S[a][b] = val; else S[a] = val;
  if (path === 'search' || path === 'peta.q') {
    const pos = el.selectionStart; render('same');
    const ne = $app.querySelector(`[data-in="${path}"]`); if (ne) { ne.focus(); try { ne.setSelectionRange(pos, pos); } catch(_){} }
  } else if (isChange && el.tagName === 'SELECT' && a !== 'reg') render('same');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.sheet) { S.sheet = null; render('same'); } });

/* ================= AFTER RENDER: timers & gestures ================= */
function after(){
  clearInterval(bannerTimer);
  if (S.screen === 'home') bannerTimer = setInterval(() => {
    if (S.screen !== 'home' || S.sheet) return;
    S.banner = (S.banner + 1) % 3;
    const tr = $app.querySelector('.bn-track'); if (tr) tr.style.transform = `translateX(-${S.banner*100}%)`;
    $app.querySelectorAll('.bn-dots i').forEach((d, i) => d.classList.toggle('on', i === S.banner));
  }, 4500);
  if (S.screen === 'search') { const q = document.getElementById('q'); if (q && document.activeElement !== q && !S.search) q.focus(); }
  if (S.screen === 'radar' && S.radar.tab === 'proyeksi') wrapSim();
  if (S.screen === 'splash') drag($app.querySelector('.slides'), dx => { if (Math.abs(dx) > 50) setSlide(S.slide + (dx < 0 ? 1 : -1)); }, false);
  if (S.screen === 'magang') {
    const c = document.getElementById('topcard');
    if (c) drag(c, dx => { if (dx > 90) magDecide('apply'); else if (dx < -90) magDecide('skip'); else { c.style.transform = ''; } }, true);
  }
}
function wrapSim(){
  const sl = document.getElementById('add'); if (!sl || document.getElementById('simout')) return;
  const card = sl.closest('.card'); card.id = 'simout';
  const lab = card.querySelector('label b'); lab.dataset.o = 'v';
  const st = card.querySelector('.stat'); st.dataset.o = 't'; st.nextElementSibling.dataset.o = 'm';
  card.querySelector('.bar i').dataset.o = 'b';
}
function drag(el, onEnd, live){
  if (!el) return; let x0 = null, dx = 0, id = null;
  el.addEventListener('pointerdown', e => { if (e.target.closest('button') && !live) {} x0 = e.clientX; dx = 0; id = e.pointerId; });
  el.addEventListener('pointermove', e => {
    if (x0 === null || e.pointerId !== id) return; dx = e.clientX - x0;
    if (live && Math.abs(dx) > 6) {
      el.style.transition = 'none'; el.style.transform = `translateX(${dx}px) rotate(${dx/18}deg)`;
      el.querySelector('.stamp.yes').style.opacity = Math.max(0, Math.min(1, dx/90));
      el.querySelector('.stamp.no').style.opacity = Math.max(0, Math.min(1, -dx/90));
    }
  });
  const end = () => {
    if (x0 === null) return; x0 = null;
    if (Math.abs(dx) > 12) { swiped = true; setTimeout(() => swiped = false, 60); }
    if (live) { el.style.transition = ''; el.querySelectorAll('.stamp').forEach(s => s.style.opacity = 0); }
    onEnd(dx);
  };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end); el.addEventListener('pointerleave', e => { if (x0 !== null && live) end(); });
}

/* ================= GUIDE PANEL (desktop) ================= */
const GUIDE = [
  ['Alur pengguna', [['splash','1','Halaman awal & daftar','Onboarding, isi profil, unggah ijazah, skor AI'],['home','2','Beranda','Fitur utama, rekomendasi, info terbaru']]],
  ['Enam fitur utama', FEATURES.map(f => [f.id, f.icon, f.name, 'Menjawab: ' + f.ans])],
  ['Lainnya', [['peluang','brief','Peluang saya','Status lamaran yang bergerak sendiri'],['profil','user','Profil & privasi','Skor kesiapan, izin data, mode ringan'],['info','cal','Peta jalan 2026–2030','Peluncuran bertahap per klaster']]],
];
function buildGuide(){
  const g = document.getElementById('guide'); if (!g) return;
  g.innerHTML = `<img class="g-logo" src="${A.logo}" alt="KOMPAK"><h1>Prototype interaktif Kompas Kerja</h1>
    <p>Klik langsung di layar ponsel seperti aplikasi sungguhan: daftar akun, buka peta, geser kartu magang, atau atur simulasi proyeksi. Atau lompat ke fitur di bawah.</p>
    ${GUIDE.map(([h, rows]) => `<h2>${h}</h2>${rows.map(([id, icn, t, s]) => `<button class="g-btn" data-j="${id}">${A['ic_'+icn] ? `<img src="${A['ic_'+icn]}" alt="">` : `<span class="g-num">${/^\d$/.test(icn) ? icn : ic(icn).replace('<svg','<svg style="width:16px;height:16px"')}</span>`}<span>${t}<small>${s}</small></span></button>`).join('')}`).join('')}
    <button class="g-reset" data-j="reset">Mulai ulang demo</button>
    <p class="g-note">Tampilan, perusahaan, dan lowongan di dalam aplikasi adalah ilustrasi konsep. Angka statistik berasal dari analisis Tim Softboy atas data BPS.</p>`;
  g.addEventListener('click', e => {
    const b = e.target.closest('[data-j]'); if (!b) return; const v = b.dataset.j; epoch++;
    if (v === 'reset') { S = initState(); render('fwd'); syncGuide(); return; }
    if (v === 'splash') { const keep = S; S = initState(); S.saved = keep.saved; render('fwd'); syncGuide(); return; }
    S.logged = true; S.sheet = null;
    S.stack = ['home','peluang','profil','notif'].includes(v) ? [] : [{screen:'home', params:{}}];
    S.screen = v; S.params = {}; render('fwd'); syncGuide();
  });
}
function syncGuide(){
  const map = {splash:'splash', login:'splash', register:'splash', analyzing:'splash', ready:'splash', detail:null, search:'home', data:'home', notif:'home'};
  const cur = S.screen in map ? map[S.screen] : S.screen;
  document.querySelectorAll('.g-btn').forEach(b => b.classList.toggle('on', b.dataset.j === cur));
}

/* ================= SCALE TO VIEWPORT ================= */
function fit(){
  const wrap = document.querySelector('.device-wrap'), dev = document.querySelector('.device');
  if (innerWidth > 820) { const s = Math.min(1, (innerHeight - 36) / 868); wrap.style.width = 414*s + 'px'; wrap.style.height = 868*s + 'px'; dev.style.transform = `scale(${s})`; }
  else { wrap.style.width = ''; wrap.style.height = ''; dev.style.transform = ''; }
}
addEventListener('resize', fit);
buildGuide(); fit(); render('fwd'); syncGuide();

</script>
